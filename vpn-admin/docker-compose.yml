services:
  app:
    build:
      context: .
      args:  # filled by update.sh
        APP_TREE: ${APP_TREE:-}
        APP_COMMIT: ${APP_COMMIT:-}
        APP_COMMIT_DATE: ${APP_COMMIT_DATE:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    image: vpn-admin:latest
    container_name: vpn-admin
    restart: unless-stopped
    env_file: .env
    environment:
      # tests only: a local ACME server (Pebble) instead of Let's Encrypt; empty = Let's Encrypt
      ACME_SERVER: ${ACME_SERVER:-}
      ACME_INSECURE: ${ACME_INSECURE:-}
    volumes:
      - ./data:/data
    # Host network: the admin listens on BIND_ADDR:PORT from .env, reaches a 3x-ui panel on the
    # same server at 127.0.0.1, and certbot can take port 80 for the few seconds of a
    # Let's Encrypt check without holding it the rest of the time.
    network_mode: host

  # Alternative HTTPS on port 443 via Caddy (install.sh enables it when DOMAIN is set).
  # Needs ports 80 and 443 free; otherwise issue a certificate in the admin (Система → HTTPS).
  caddy:
    image: caddy:2.8
    container_name: vpn-admin-caddy
    restart: unless-stopped
    profiles: ["https"]
    depends_on: [app]
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:-}
      APP_PORT: ${PORT:-8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
