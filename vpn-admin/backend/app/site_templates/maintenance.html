<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{domain}} — Scheduled maintenance</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f8; color: #1f2933;
  }
  .card { max-width: 520px; width: 100%; background: #fff; border-radius: 18px; padding: 48px 40px; text-align: center;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 12px 32px rgba(16, 24, 40, .08); }
  svg { width: 72px; height: 72px; color: #2563eb; animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin-top: 24px; font-size: 28px; }
  p { margin-top: 14px; color: #52606d; line-height: 1.6; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; padding: 8px 14px;
    border-radius: 999px; background: #eff6ff; color: #1d4ed8; font-size: 14px; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #2563eb; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  footer { margin-top: 32px; font-size: 13px; color: #9aa5b1; }
  a { color: #2563eb; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
  <h1>We'll be back shortly</h1>
  <p>{{domain}} is undergoing scheduled maintenance to improve performance and reliability. Thank you for your patience.</p>
  <div class="status"><span class="dot"></span> Maintenance in progress</div>
  <footer>Questions? Write to <a href="mailto:support@{{domain}}">support@{{domain}}</a></footer>
</div>
</body>
</html>
