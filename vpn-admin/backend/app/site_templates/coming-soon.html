<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{domain}} — Coming soon</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f5f3ff; background: radial-gradient(1200px 600px at 10% 10%, #5b21b6 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 90%, #0e7490 0%, transparent 60%), #0b0a16;
  }
  main { max-width: 560px; text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 28px; border-radius: 16px;
    background: linear-gradient(135deg, #a78bfa, #22d3ee); box-shadow: 0 10px 40px rgba(167, 139, 250, .45); }
  h1 { font-size: clamp(34px, 6vw, 52px); line-height: 1.1; letter-spacing: -0.02em; }
  p { margin-top: 18px; color: #c4b5fd; font-size: 18px; line-height: 1.6; }
  form { margin-top: 32px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  input { flex: 1 1 240px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06); color: #fff; font-size: 16px; }
  input::placeholder { color: #a5a3c0; }
  button { padding: 14px 22px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
    background: #f5f3ff; color: #2e1065; }
  .thanks { display: none; margin-top: 20px; color: #67e8f9; }
  footer { margin-top: 56px; font-size: 13px; color: #8b88a8; }
</style>
</head>
<body>
<main>
  <div class="logo"></div>
  <h1>Something new is on the way</h1>
  <p>We are putting the finishing touches on {{domain}}. Leave your email and we will let you know the moment we launch.</p>
  <form onsubmit="this.style.display='none';document.querySelector('.thanks').style.display='block';return false;">
    <input type="email" required placeholder="you@example.com" aria-label="Email">
    <button type="submit">Notify me</button>
  </form>
  <div class="thanks">Thank you! We will be in touch.</div>
  <footer>&copy; {{year}} {{domain}}</footer>
</main>
</body>
</html>
